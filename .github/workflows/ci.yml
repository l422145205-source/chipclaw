name: Public workbench checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.txt pytest httpx
      - run: python -m pytest tests/test_workbench.py -q
      - run: node --check web/assets/app.js
